<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>SDGS 關鍵字管理</title>
  <link rel="stylesheet" href="1234.css" />
</head>
<body>
  <div class="box">
    <h1>🌎 SDGS 關鍵字管理</h1>
    <textarea id="global-input" placeholder="每行一筆關鍵字"></textarea><br />
    <select id="sdg-select">
      <option value="1">SDG 1</option><option value="2">SDG 2</option>
      <option value="3">SDG 3</option><option value="4">SDG 4</option>
    </select>
    <button onclick="saveData()">儲存</button>
    <p id="msg"></p>
  </div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxSUfZyQEWx2D8n10F92YvoOdOcyBZgBcMqb1ogcNStdmJcnp1ymKLhGz25Tt-0Bwxw/exec";
    async function saveData() {
      const sdg = document.getElementById('sdg-select').value;
      const lines = document.getElementById('global-input').value.trim().split('\n').filter(Boolean);
      for (const keyword of lines) {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `sdg=${sdg}&keyword=${encodeURIComponent(keyword)}`
        });
      }
      document.getElementById('msg').textContent = "✅ 資料已送出！請查看 Google Sheet";
    }
  </script>
</body>
</html>
